name: Build Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    defaults:
      run:
        shell: cmd

    env:
      PREPARE_PATH: "Telegram/build/prepare/prepare.py"

    steps:
      - name: Prepare directories
        run: |
          mkdir %userprofile%\TBuild\Libraries
          mklink /d %GITHUB_WORKSPACE%\TBuild %userprofile%\TBuild
          echo TBUILD=%GITHUB_WORKSPACE%\TBuild>>%GITHUB_ENV%
          echo LibrariesPath=%GITHUB_WORKSPACE%\TBuild\Libraries\win64>>%GITHUB_ENV%

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: TBuild/AyuGramDesktop

      - name: Populate submodules
        shell: bash
        run: |
          cd "$TBUILD/AyuGramDesktop"
          git clone --depth=1 --branch v7.2.9 --filter=blob:none --no-checkout https://github.com/AyuGram/AyuGramDesktop.git /tmp/ayu-ref
          git config --file .gitmodules --get-regexp '\.path$' | while read -r key sub_path; do
            name="${key%.path}"
            url="$(git config --file .gitmodules --get "${name}.url")"
            if [ -z "$(ls -A "$sub_path" 2>/dev/null)" ]; then
              rm -rf "$sub_path"
              commit="$(git -C /tmp/ayu-ref ls-tree v7.2.9 "$sub_path" | awk '$2 == "commit" { print $3 }')"
              if [ -n "$commit" ]; then
                git init "$sub_path"
                git -C "$sub_path" remote add origin "$url"
                git -C "$sub_path" fetch --depth=1 origin "$commit"
                git -C "$sub_path" checkout FETCH_HEAD
              else
                git clone --depth=1 "$url" "$sub_path"
              fi
            fi
          done
          rm -rf /tmp/ayu-ref

      - name: Compute cache key
        shell: bash
        run: |
          echo "CACHE_KEY=$(sha256sum "$TBUILD/AyuGramDesktop/$PREPARE_PATH" | awk '{ print $1 }')" >> "$GITHUB_ENV"

      - name: Restore ThirdParty cache
        id: cache-third-party
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: ${{ runner.OS }}-x64-thirdparty-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-x64-thirdparty-

      - name: Restore Libraries cache
        id: cache-libs
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\cache_keys
            !${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\*
            !${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-x64-libsrel-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-x64-libsrel-

      - name: Restore Qt cache
        id: cache-qt
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-x64-qtrel-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-x64-qtrel-

      - name: Setup MSVC x64 environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          vsversion: '2022'

      - name: Prepare libraries
        run: |
          %TBUILD%\AyuGramDesktop\Telegram\build\prepare\win.bat silent qt6

      - name: Save ThirdParty cache
        if: steps.cache-third-party.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: ${{ steps.cache-third-party.outputs.cache-primary-key }}

      - name: Save Libraries cache
        if: steps.cache-libs.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\cache_keys
            !${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\*
            !${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ steps.cache-libs.outputs.cache-primary-key }}

      - name: Save Qt cache
        if: steps.cache-qt.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ steps.cache-qt.outputs.cache-primary-key }}

      - name: Restore out cache
        id: cache-out
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.TBUILD }}\AyuGramDesktop\out
          key: ${{ runner.OS }}-x64-out-${{ github.sha }}
          restore-keys: ${{ runner.OS }}-x64-out-

      - name: Configure and build
        run: |
          cd %TBUILD%\AyuGramDesktop\Telegram
          call configure.bat ^
            x64 ^
            qt6 ^
            -Wno-error=dev ^
            -D CBOR_MAX_UNCHECKED_DECLARED_SIZE=0 ^
            -D TDESKTOP_API_ID=${{ secrets.TDESKTOP_API_ID || '17349' }} ^
            -D TDESKTOP_API_HASH=${{ secrets.TDESKTOP_API_HASH || '344583e45741c457fe1862106095a5eb' }} ^
            -D CMAKE_CONFIGURATION_TYPES=Release ^
            -D DESKTOP_APP_SPECIAL_TARGET=win64 ^
            -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON ^
            -D DESKTOP_APP_DISABLE_CRASH_REPORTS=ON
          cmake --build ..\out --config Release --target Telegram -- -m:2 /p:CL_MPCount=2

      - name: Save out cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.TBUILD }}\AyuGramDesktop\out
          key: ${{ runner.OS }}-x64-out-${{ github.sha }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AyuGram-win64
          path: ${{ env.TBUILD }}\AyuGramDesktop\out\Release\Telegram.exe
